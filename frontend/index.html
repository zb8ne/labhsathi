<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabhSathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!--
      Runtime (not build-time) config. Vite env vars are baked in at build
      time, which would mean a separate image per deploy target (Compose /
      kind / Railway). Instead the container entrypoint (infra or
      docker/entrypoint.sh) writes this file from an env var at container
      start, so one built image works everywhere. Falls back to same-origin
      "/api" if nothing overwrote it (matches the Vite dev proxy).
    -->
    <script>
      window.__LABHSATHI_CONFIG__ = { apiBaseUrl: "/api" };
    </script>
    <script src="/env.js" onerror="void 0"></script>
    <!--
      Applied before first paint, blocking, so there's no flash of the
      wrong theme while React hydrates -- ThemeContext reads/writes the
      same "labhsathi:theme" key and keeps this in sync after mount.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("labhsathi:theme");
          var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // storage/matchMedia unavailable -- default light, same as ThemeContext's fallback
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
