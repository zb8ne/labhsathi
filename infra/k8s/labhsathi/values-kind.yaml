# Overlay for the local kind demo (docs/adr/0001, 3-hour timebox). NodePort
# over Ingress on purpose -- installing ingress-nginx is one more moving
# part not worth adding inside that window. `helm install -f
# values-kind.yaml` on top of the defaults in values.yaml.

apiGateway:
  service:
    type: NodePort
  # GitHub issue #5: the default ~5/hour anti-abuse limit (the real
  # public-deployment posture) makes generating enough load to trigger the
  # HPA demo essentially impossible. Raised here, deliberately, only for
  # this ephemeral demo cluster -- decided ahead of time rather than
  # discovered live while recording. See the README in this directory for
  # the actual load command.
  uploadRateLimit:
    burstSize: 200
    periodSeconds: 1

frontend:
  service:
    type: NodePort

ingress:
  enabled: false
