{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "labhsathi.name" (dict "service" "ingress" "kind" "ingress") }}
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m" # matches MAX_IMAGE_BYTES in labhsathi-core::media
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ include "labhsathi.name" (dict "service" "ingress" "kind" "tls") }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "labhsathi.name" (dict "service" "api-gateway" "kind" "svc") }}
                port:
                  number: {{ .Values.apiGateway.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "labhsathi.name" (dict "service" "frontend" "kind" "svc") }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
