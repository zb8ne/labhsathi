apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labhsathi.name" (dict "service" "redis" "kind" "deployment") }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "labhsathi.labels" (dict "service" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Persistence deliberately off, same as infra/docker/docker-compose.yml
          # -- a literal enforcement of "cache, not datastore" in every
          # environment, not just prod. See docs/adr/0001.
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labhsathi.name" (dict "service" "redis" "kind" "svc") }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
