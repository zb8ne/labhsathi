apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labhsathi.name" (dict "service" "api-gateway" "kind" "deployment") }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "labhsathi.labels" (dict "service" "api-gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BROKERS
              value: "{{ include "labhsathi.name" (dict "service" "kafka" "kind" "svc") }}:9092"
            - name: REDIS_URL
              value: "redis://{{ include "labhsathi.name" (dict "service" "redis" "kind" "svc") }}:6379"
            - name: PORT
              value: "{{ .Values.apiGateway.port }}"
            - name: UPLOAD_RATE_LIMIT_BURST
              value: "{{ .Values.apiGateway.uploadRateLimit.burstSize }}"
            - name: UPLOAD_RATE_LIMIT_PERIOD_SECS
              value: "{{ .Values.apiGateway.uploadRateLimit.periodSeconds }}"
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labhsathi.name" (dict "service" "api-gateway" "kind" "svc") }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  selector:
    app.kubernetes.io/component: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
