apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labhsathi.name" (dict "service" "kafka" "kind" "deployment") }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "labhsathi.labels" (dict "service" "kafka") | nindent 4 }}
spec:
  replicas: 1
  # Single-node KRaft broker -- hackathon scope. A real 3-broker quorum
  # needs a StatefulSet, persistent volumes per broker, and proper
  # discovery; documented as prod intent in values-prod.yaml rather than
  # built here (see docs/adr/0001 for the reasoning).
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "labhsathi.name" (dict "service" "kafka" "kind" "svc") }}:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            # Default is 1 -- a single partition means only one consumer in
            # a group can ever be active regardless of replica count, so
            # the ocr-worker HPA scaling pods alone wouldn't prove any
            # throughput increase. See docs/engineering/reliability-proof.md.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          ports:
            - containerPort: 9092
            - containerPort: 9093
          readinessProbe:
            exec:
              # kafka-broker-api-versions.sh spins up its own JVM client per
              # invocation -- the default 1s exec-probe timeout isn't enough
              # even once the broker itself is fully up.
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labhsathi.name" (dict "service" "kafka" "kind" "svc") }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
