apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labhsathi.name" (dict "service" "frontend" "kind" "deployment") }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "labhsathi.labels" (dict "service" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}/frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Browser-facing -- must be reachable from outside the cluster,
            # not the in-cluster service DNS name. Override per environment
            # (e.g. via --set frontend.apiBaseUrl=...) once the api-gateway
            # ingress/NodePort URL for this deploy is known.
            - name: API_BASE_URL
              value: "{{ .Values.frontend.apiBaseUrl | default "/api" }}"
            # GitHub issue #2: with ingress disabled (values-kind.yaml) and
            # API_BASE_URL left at its same-origin "/api" default, nginx
            # needs to actually proxy that somewhere -- the in-cluster
            # api-gateway service, reachable by DNS name within the
            # namespace regardless of whether it has a public
            # domain/ingress at all. No path component on this URL --
            # nginx forwards the full "/api/..." path unchanged only when
            # proxy_pass itself has none (see nginx.conf.template).
            - name: API_PROXY_PASS
              value: "http://{{ include "labhsathi.name" (dict "service" "api-gateway" "kind" "svc") }}:{{ .Values.apiGateway.port }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labhsathi.name" (dict "service" "frontend" "kind" "svc") }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
