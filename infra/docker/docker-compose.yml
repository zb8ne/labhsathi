name: labhsathi

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: labhsathi-kafka
    environment:
      # Single-broker KRaft mode -- no ZooKeeper. Documented as a 3-broker
      # cluster in prod (see infra/k8s/labhsathi/values-prod.yaml and
      # docs/adr/0001); this is explicitly hackathon-scope, not a claim
      # about production readiness.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Default is 1 -- a single partition means only ONE consumer in
      # a group can ever be active regardless of replica count, so
      # scaling ocr-worker pods alone would prove nothing about
      # throughput. 3 partitions lets up to 3 consumers actually run
      # in parallel. See docs/engineering/reliability-proof.md.
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: labhsathi-redis
    # Persistence deliberately off -- a literal enforcement of "cache, not
    # datastore" even in local dev, not just a prod concern. See ADR 0001.
    command: ["redis-server", "--save", "\"\"", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: labhsathi-api-gateway
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr-worker:
    build:
      context: ../..
      dockerfile: services/ocr-worker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      KAFKA_CONSUMER_GROUP: ocr-worker-group
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY, e.g. via Doppler or a local .env}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale locally with: docker compose up --scale ocr-worker=3
    # (this doubles as the kind-demo fallback visual, see docs/adr/0001)

  frontend:
    build:
      context: ../../frontend
    container_name: labhsathi-frontend
    environment:
      # Browser calls this at runtime (via env.js), so it must be reachable
      # from the user's machine, not just from inside the compose network.
      API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
