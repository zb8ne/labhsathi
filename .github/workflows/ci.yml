name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them
# race to completion -- saves minutes on rapid pushes (free on this public
# repo either way, but no reason to burn them).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build, test, ignored integration tests)
    runs-on: ubuntu-latest

    # Real Postgres and Redis, matching infra/docker/docker-compose.yml --
    # this is what lets the --ignored integration tests
    # (services/api-gateway/src/redis_cache.rs,
    # services/catalog-service/src/main.rs) run in CI instead of being
    # permanently skipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labhsathi_catalog
          POSTGRES_USER: labhsathi
          POSTGRES_PASSWORD: labhsathi_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labhsathi -d labhsathi_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Same package set as the Docker builder stages (services/*/Dockerfile)
      # -- rdkafka needs a C toolchain even for dynamic linking against
      # librdkafka, and dynamic linking (not the cmake-build feature) is
      # the whole reason this list exists rather than just pulling in a
      # vendored build.
      - name: Install system dependencies (rdkafka build requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev librdkafka-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --verbose

      - name: cargo test --workspace (default tests)
        run: cargo test --workspace --verbose

      - name: cargo test -p api-gateway -- --ignored (real Redis)
        env:
          REDIS_URL: redis://localhost:6379
        run: cargo test -p api-gateway -- --ignored

      - name: cargo test -p catalog-service -- --ignored (real Postgres)
        env:
          # --test-threads=1: both tests call CREATE TABLE IF NOT EXISTS
          # against the same fresh database -- confirmed via a real
          # reproduction that running them concurrently can race and throw
          # a duplicate-key error on pg_catalog.pg_type. See the comment
          # in services/catalog-service/src/main.rs.
          DATABASE_URL: postgres://labhsathi:labhsathi_ci_only@localhost:5432/labhsathi_catalog
        run: cargo test -p catalog-service -- --ignored --test-threads=1

  frontend:
    name: Frontend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npx vitest run

  scheme-source-links:
    name: Scheme catalog source-link integrity (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # Deliberately continue-on-error: this hits ~100 real external
      # .gov.in/.nic.in (and equivalent) government sites live. A meaningful
      # chunk of those are known to reject requests from cloud/datacenter IP
      # ranges (GitHub-hosted runners included) with timeouts or connection
      # resets that have nothing to do with whether the link is actually
      # good -- confirmed by hand with `curl -v` against several of them
      # (see docs/engineering/reliability-proof.md, Demonstration 4). Failing
      # the whole build on that would make CI red for reasons unrelated to
      # a real bug. The domain-allowlist check inside the script (a fraudulent
      # or typo'd source_url) is the part with zero false-positive risk, and
      # its result is called out separately in the summary below so it's
      # never silently lost inside a step GitHub already marked "failed."
      - name: Run scripts/verify-source-links.sh
        id: verify
        continue-on-error: true
        run: scripts/verify-source-links.sh | tee link-check-output.txt

      - name: Fail only on a real domain-allowlist violation
        run: |
          if grep -q "DOMAIN_NOT_ALLOWLISTED\|REDIRECTED_OFF_ALLOWLIST" link-check-output.txt; then
            echo "::error::A scheme's source_url resolved to a domain outside scripts/trusted-source-domains.txt -- this is the one failure mode this job treats as a real bug, not network noise."
            exit 1
          fi
          echo "No domain-allowlist violations. Remaining non-200s (if any, see the job summary above) are HTTP-liveness noise, not gated here -- see docs/engineering/reliability-proof.md, Demonstration 4."
